# ==============================================================================
# Nginx Üretim (Production) Konfigürasyon Şablonu
# ==============================================================================
# Bu dosya, APT deponuzu Nginx arkasında yüksek performans ve güvenlik ile
# yayınlamak için hazırlanmıştır.
#
# Kurulum:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/apt-depo.conf
#   sudo ln -s /etc/nginx/sites-available/apt-depo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name depo.sirketiniz.com; # Buraya kendi domain veya IP'nizi yazın

    # İstemcilerin büyük deb paketleri yükleyebilmesi için (gerekirse)
    client_max_body_size 500M;

    # Gzip sıkıştırma (Metadata dosyaları için hızlı indirme)
    gzip on;
    gzip_types text/plain application/json application/gzip;

    # 1. Paket Meta Dosyaları (Release, Packages) -> ASLA ÖNBELLEKLENMEZ
    location ~* /(Release|InRelease|Packages)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # APT istemcilerinin güncel listeyi anında görmesi için:
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. Gerçek .deb Paket Dosyaları -> 1 YIL ÖNBELLEKLENEBİLİR (Değişmez dosyalar)
    location ~* \.deb$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # İndirme performansını maksimize et:
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/vnd.debian.binary-package;
    }

    # 3. Web Dashboard ve Genel API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
