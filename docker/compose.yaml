services:
  apt-repo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: apt_repository_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # APT veritabanı ve yayınlanan paketlerin kalıcı olarak saklanacağı alan
      - aptly_data:/root/.aptly
    environment:
      - PORT=8080

volumes:
  aptly_data:
    driver: local
